<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GratiTree — Page Not Found</title>
  <link rel="icon" href="/images/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-start: #f1fff8;
      --bg-end: #e7f3ff;
      --ink: #102a26;
      --muted: #4f6b66;
      --primary: #2a8f6b;
      --primary-hover: #197a58;
      --card-bg: rgba(255, 255, 255, 0.80);
      --glass: rgba(255, 255, 255, 0.6);
      --shadow-soft: 0 10px 40px rgba(16, 42, 38, 0.10);
      --border: 1px solid rgba(16, 42, 38, 0.10);
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      line-height: 1.6;
      background:
        radial-gradient(1000px 600px at 20% 0%, var(--bg-start), transparent),
        radial-gradient(1000px 600px at 80% 10%, var(--bg-end), transparent),
        linear-gradient(180deg, #fbfffd 0%, #f5fbff 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    a { text-decoration: none; color: inherit; }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary);
    }
    .brand img { width: 44px; height: auto; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      font-size: 0.95rem;
      user-select: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(42, 143, 107, 0.30);
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .btn-ghost {
      background: rgba(255,255,255,0.85);
      color: var(--primary);
      border: 1px solid rgba(16, 42, 38, 0.10);
    }
    .btn-ghost:hover { background: #fff; }

    main {
      padding-top: 92px;
      padding-bottom: 64px;
      min-height: calc(100vh - 156px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 24px;
      text-align: center;
    }

    .card {
      background: var(--card-bg);
      border: var(--border);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(8px);
    }

    .error-code {
      font-size: clamp(4rem, 10vw, 6rem);
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 1rem;
    }

    .title {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    footer {
      text-align: center;
      padding: 24px 0 42px;
      color: var(--muted);
      font-size: 0.85rem;
      opacity: 0.85;
    }

    @media (max-width: 480px) {
      .actions { flex-direction: column; align-items: center; }
      .card { padding: 30px 20px; }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="/">
      <span><img src="/images/logo.png" alt="GratiTree logo"></span> GratiTree
    </a>
    <div class="nav-links">
      <a class="btn btn-ghost" href="/">Home</a>
      <a class="btn btn-ghost" href="/app">Dashboard</a>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="card">
        <div class="error-code">404</div>
        <h1 class="title">Page Not Found</h1>
        <p class="subtitle">
          The page you're looking for doesn't exist. It might have been moved, deleted, or you entered the wrong URL.
        </p>
        <div class="actions">
          <a href="/" class="btn btn-primary">Go Home</a>
          <a href="/app" class="btn btn-ghost">View Trees</a>
        </div>
      </div>
    </div>
  </main>

  <footer>© 2026 GratiTree • Deployed on AWS (demo)</footer>
</body>
</html>
